name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests
        run: dotnet test CompteurRetraite.sln -c Release
      - name: Version
        id: version
        shell: bash
        run: echo "numero=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publication
        run: >
          dotnet publish src/CompteurRetraite.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.numero }}
          -p:DepotGitHub=${{ github.repository }}
          -o publish
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/CompteurRetraite.exe
          generate_release_notes: true
